<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Confirmed | ParkMate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #061521;
            font-family: 'Outfit', sans-serif;
            color: #F8FAFC;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: move 20s infinite alternate;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background-color: #0EA5E9;
            top: -100px;
            right: -100px;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background-color: #10B981;
            bottom: -50px;
            left: -50px;
            animation-delay: -5s;
        }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, 50px) scale(1.1); }
        }

        .card {
            background: rgba(11, 31, 51, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 60px 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .success-icon-container {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(5, 150, 105, 0.1) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            position: relative;
        }

        .success-icon-container::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 1px dashed rgba(16, 185, 129, 0.3);
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .check-icon {
            font-size: 48px;
            color: #10B981;
        }

        .brand {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #FEF08A;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin-bottom: 32px;
            padding: 0 20px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            background: linear-gradient(90deg, #10B981 0%, #059669 100%);
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 800;
            padding: 16px;
            text-decoration: none;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4);
        }

        .secondary-link {
            display: block;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s;
        }

        .secondary-link:hover {
            color: #FFFFFF;
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 24px;
                border-radius: 0;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                background: transparent;
                border: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="card">
        <div class="success-icon-container">
            <span class="check-icon">✓</span>
        </div>
        <div class="brand">ParkMate</div>
        <h1>Account verified</h1>
        <p>Your driver profile is now active. You can start syncing live reports and street activity.</p>
        
        <a href="parkmate://login" class="btn">Open ParkMate App</a>
        
        <a href="#" class="secondary-link">Go to Web Dashboard</a>
    </div>
</body>
</html>
